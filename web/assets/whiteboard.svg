<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Blindfold: split, compute on shares, check, then read</title>
<desc id="desc">The client sends a different share to each of three workers. Workers return output shares and authentication tags. The client checks them before accepting a character. This prototype relays the masked square opening through the client, with two client exchange phases per character.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#191918" stroke-width="1.3"/></marker>
</defs>
<rect width="1600" height="900" fill="white"/>
<g fill="#191918" font-family="Arial, sans-serif">
 <text x="65" y="85" font-size="48">Blindfold</text>
 <text x="65" y="132" font-size="24">Use someone else’s computer without handing it your words</text>
 <text x="65" y="250" font-size="23">1. SPLIT</text>
 <text x="620" y="170" font-size="23">2. COMPUTE ON SHARES</text>
 <text x="1110" y="310" font-size="23">3. CHECK</text>
 <text x="1110" y="730" font-size="23">4. READ OR STOP</text>
</g>
<g fill="none" stroke="#191918" stroke-width="3">
 <rect x="65" y="315" width="285" height="160"/>
 <rect x="620" y="210" width="280" height="95"/>
 <rect x="620" y="365" width="280" height="95"/>
 <rect x="620" y="520" width="280" height="95"/>
 <rect x="1110" y="365" width="365" height="95"/>
 <path d="M350 395H470M470 257V567M470 257H610M470 412H610M470 567H610" marker-end="url(#arrow)"/>
 <path d="M470 257H610" marker-end="url(#arrow)"/>
 <path d="M470 412H610" marker-end="url(#arrow)"/>
 <path d="M900 257H1010V567H900"/>
 <path d="M900 412H1100" marker-end="url(#arrow)"/>
 <path d="M1290 460V515H1390V585" marker-end="url(#arrow)"/>
 <path d="M1290 515H1200V585" marker-end="url(#arrow)"/>
 <rect x="1110" y="595" width="175" height="85" stroke="#8b2e2e"/>
 <rect x="1305" y="595" width="175" height="85"/>
 <path d="M1010 577V735H205V490" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
</g>
<g fill="#191918" font-family="Arial, sans-serif" font-size="27">
 <text x="90" y="355">YOUR DEVICE</text>
 <text x="90" y="402">Private input</text>
 <text x="90" y="444" font-size="21">Fresh masks + helpers</text>
 <text x="650" y="252">Worker A</text><text x="650" y="285" font-size="21">share A + public model</text>
 <text x="650" y="407">Worker B</text><text x="650" y="440" font-size="21">share B + public model</text>
 <text x="650" y="562">Worker C</text><text x="650" y="595" font-size="21">share C + public model</text>
 <text x="1138" y="405">Your device checks tags</text>
 <text x="1138" y="439" font-size="21">before accepting the character</text>
 <text x="1147" y="647" fill="#8b2e2e">STOP</text>
 <text x="1330" y="647">ANSWER</text>
 <text x="1120" y="508" font-size="21" fill="#8b2e2e">fail</text>
 <text x="1410" y="508" font-size="21">pass</text>
 <text x="375" y="226" font-size="21">different piece</text>
 <text x="375" y="250" font-size="21">to each worker</text>
 <text x="945" y="210" font-size="21">output shares</text>
 <text x="945" y="235" font-size="21">+ tags</text>
 <text x="290" y="703" font-size="22">Masked square opening: client checks + relays</text>
 <text x="65" y="805" font-size="25">Keep one worker honest: the other two cannot reconstruct the input</text>
 <text x="65" y="850" font-size="19" fill="#62625c">Current prototype: 2 client exchange phases per character. Default demo: 3 processes on one laptop.</text>
</g>
</svg>
